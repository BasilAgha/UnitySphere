<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="title.index">UnitySphere Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"><img src="Logo 03.png" alt="UnitySphere logo" /></div>
      </div>
      <nav class="nav">
        <div class="nav-group">
          <div class="nav-group-title" data-i18n="nav.group.overview">Overview</div>
          <a class="nav-item active" aria-current="page" href="index.html">
            <span class="nav-icon">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 10.5L12 3l9 7.5"></path>
                <path d="M6 10v9h12v-9"></path>
              </svg>
            </span>
            <span class="nav-label" data-i18n="nav.overview">Overview</span>
          </a>
        </div>
        <div class="nav-group">
          <div class="nav-group-title" data-i18n="nav.group.management">Management</div>
          <a class="nav-item" href="centers.html">
            <span class="nav-icon">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="4" y="6" width="16" height="14" rx="2"></rect>
                <path d="M9 6V4h6v2"></path>
              </svg>
            </span>
            <span class="nav-label" data-i18n="nav.centers">Centers</span>
          </a>
          <a class="nav-item" href="specialists.html">
            <span class="nav-icon">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="8" r="3"></circle>
                <path d="M5 20c1.5-4 12.5-4 14 0"></path>
              </svg>
            </span>
            <span class="nav-label" data-i18n="nav.specialists">Specialists</span>
          </a>
          <a class="nav-item" href="children.html">
            <span class="nav-icon">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="8" cy="9" r="3"></circle>
                <circle cx="16" cy="9" r="3"></circle>
                <path d="M3 20c1-4 9-4 10 0"></path>
                <path d="M11 20c1-4 9-4 10 0"></path>
              </svg>
            </span>
            <span class="nav-label" data-i18n="nav.children">Children</span>
          </a>
        </div>
        <div class="nav-group">
          <div class="nav-group-title" data-i18n="nav.group.content">Content</div>
          <a class="nav-item" href="vr.html">
            <span class="nav-icon">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 10a8 8 0 0 1 16 0"></path>
                <rect x="3" y="10" width="18" height="7" rx="3"></rect>
                <path d="M8 17v3"></path>
                <path d="M16 17v3"></path>
              </svg>
            </span>
            <span class="nav-label" data-i18n="nav.vr">VR Experience</span>
          </a>
        </div>
        <div class="nav-group">
          <div class="nav-group-title" data-i18n="nav.group.system">System</div>
          <a class="nav-item" href="settings.html">
            <span class="nav-icon">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19 12a7 7 0 0 0-.1-1l2-1-2-3-2 1a7 7 0 0 0-1.7-1l.2-2.2h-3l.2 2.2a7 7 0 0 0-1.7 1l-2-1-2 3 2 1a7 7 0 0 0 0 2l-2 1 2 3 2-1a7 7 0 0 0 1.7 1l-.2 2.2h3l-.2-2.2a7 7 0 0 0 1.7-1l2 1 2-3-2-1c.07-.33.1-.66.1-1z"></path>
              </svg>
            </span>
            <span class="nav-label" data-i18n="nav.settings">Settings</span>
          </a>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-actions">
          <button class="btn primary logout-btn" type="button" data-logout data-i18n="sidebar.logout">Logout</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="page-topbar">
        <button class="icon-btn" type="button" aria-label="Quick menu">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="5" width="14" height="14" rx="2"></rect>
            <path d="M9 5v14"></path>
          </svg>
        </button>
        <button class="lang-toggle" type="button" data-lang-toggle></button>
      </div>
      <section class="overview">
        <header class="topbar">
          <div>
            <h1 data-i18n="index.title">Admin Overview</h1>
          </div>
        </header>

        <section class="grid metrics kpi-grid">
          <div class="card metric-card metric-card--children kpi-card" style="--delay: 0.15s;" aria-label="Children KPI">
            <div class="card-header">
              <div>
                <div class="metric-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="8" r="3"></circle>
                    <path d="M5 20c1.5-4 12.5-4 14 0"></path>
                  </svg>
                </div>
                <div class="micro-label" data-i18n="label.children">Children</div>
              </div>
              <div class="kpi-sparkline" id="spark-children"></div>
            </div>
            <div class="card-body">
              <div class="metric-value kpi-value" id="metric-children"></div>
              <div class="kpi-mini">
                <div class="kpi-chip" id="metric-children-today">-</div>
                <div class="kpi-chip" id="metric-children-week">-</div>
              </div>
            </div>
          </div>
          <div class="card metric-card metric-card--specialists kpi-card" style="--delay: 0.2s;" aria-label="Specialists KPI">
            <div class="card-header">
              <div>
                <div class="metric-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="8" r="3"></circle>
                    <path d="M5 20c1.5-4 12.5-4 14 0"></path>
                  </svg>
                </div>
                <div class="micro-label" data-i18n="label.specialists">Specialists</div>
              </div>
              <div class="kpi-sparkline" id="spark-specialists"></div>
            </div>
            <div class="card-body">
              <div class="metric-value kpi-value" id="metric-specialists"></div>
              <div class="kpi-mini">
                <div class="kpi-chip" id="metric-specialists-today">-</div>
                <div class="kpi-chip" id="metric-specialists-week">-</div>
              </div>
            </div>
          </div>
          <div class="card metric-card metric-card--centers kpi-card" style="--delay: 0.25s;" aria-label="Centers KPI">
            <div class="card-header">
              <div>
                <div class="metric-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <rect x="4" y="6" width="16" height="14" rx="2"></rect>
                    <path d="M9 6V4h6v2"></path>
                  </svg>
                </div>
                <div class="micro-label" data-i18n="label.centers">Centers</div>
              </div>
              <div class="kpi-sparkline" id="spark-centers"></div>
            </div>
            <div class="card-body">
              <div class="metric-value kpi-value" id="metric-centers">0</div>
              <div class="kpi-mini">
                <div class="kpi-chip" id="metric-centers-today">-</div>
                <div class="kpi-chip" id="metric-centers-week">-</div>
              </div>
            </div>
          </div>
          <div class="card metric-card metric-card--vr kpi-card" style="--delay: 0.3s;" aria-label="VR KPI">
            <div class="card-header">
              <div>
                <div class="metric-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <path d="M4 10a8 8 0 0 1 16 0"></path>
                    <rect x="3" y="10" width="18" height="7" rx="3"></rect>
                    <path d="M8 17v3"></path>
                    <path d="M16 17v3"></path>
                  </svg>
                </div>
                <div class="micro-label" data-i18n="label.vrExperiences">VR Experiences</div>
              </div>
              <div class="kpi-sparkline" id="spark-vr"></div>
            </div>
            <div class="card-body">
              <div class="metric-value kpi-value" id="metric-vr">0</div>
              <div class="kpi-mini">
                <div class="kpi-chip" id="metric-vr-today">-</div>
                <div class="kpi-chip" id="metric-vr-week">-</div>
              </div>
            </div>
          </div>
        </section>

        <section class="overview-section">
          <div class="grid snapshot-grid">
            <div class="card snapshot-card donut-card" style="--delay: 0.35s;" aria-label="Overall accuracy">
              <div class="micro-label" data-i18n="label.accuracy">Accuracy</div>
              <svg class="donut-chart" id="snapshot-accuracy-ring" viewBox="0 0 120 120" aria-hidden="true"></svg>
              <div class="donut-value" id="snapshot-accuracy">-</div>
              <div class="micro-caption" id="snapshot-accuracy-caption"></div>
            </div>
            <div class="card snapshot-card progress-card" style="--delay: 0.4s;" aria-label="Avg session duration">
              <div class="micro-label" data-i18n="label.duration">Duration</div>
              <div class="progress-track">
                <div class="progress-fill" id="snapshot-duration-bar"></div>
                <span class="baseline-marker" id="snapshot-duration-baseline"></span>
              </div>
              <div class="snapshot-value" id="snapshot-duration">-</div>
              <div class="micro-caption" id="snapshot-duration-caption"></div>
            </div>
            <div class="card snapshot-card gauge-card" style="--delay: 0.45s;" aria-label="Avg attempts per question">
              <div class="micro-label" data-i18n="label.attempts">Attempts</div>
              <svg class="gauge-chart" id="snapshot-attempts-gauge" viewBox="0 0 120 70" aria-hidden="true"></svg>
              <div class="snapshot-value" id="snapshot-attempts">-</div>
              <div class="micro-caption" id="snapshot-attempts-caption"></div>
            </div>
            <div class="card snapshot-card donut-card" style="--delay: 0.5s;" aria-label="Easy mode usage">
              <div class="micro-label" data-i18n="label.easy">Easy</div>
              <svg class="donut-chart" id="snapshot-easy-ring" viewBox="0 0 120 120" aria-hidden="true"></svg>
              <div class="donut-value" id="snapshot-easy">-</div>
              <div class="micro-caption" id="snapshot-easy-caption"></div>
            </div>
          </div>
        </section>

        <section class="overview-section"></section>

        <section class="overview-section"></section>

        <section class="overview-section"></section>
      </section>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/7.24.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/7.24.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/7.24.0/firebase-firestore.js"></script>
  <script src="app.js"></script>
</body>
</html>
